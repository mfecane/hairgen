name: hairgen

services:
    postgres:
        image: postgres:16-alpine
        container_name: hairgen-postgres
        environment:
            POSTGRES_USER: hairgen
            POSTGRES_PASSWORD: zzzz
            POSTGRES_DB: hairgen
            # Suppress logical replication launcher messages
            POSTGRES_INITDB_ARGS: '--no-locale'
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U hairgen']
            interval: 5s
            timeout: 3s
            retries: 10

    minio:
        image: minio/minio:latest
        container_name: hairgen-minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        ports:
            - '127.0.0.1:9002:9000' # S3 API
            - '127.0.0.1:9001:9001' # Console UI
        volumes:
            - minio_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 5s
            timeout: 3s
            retries: 10

    mailpit:
        image: axllent/mailpit
        container_name: mailpit
        ports:
            - '1025:1025' # SMTP
            - '8025:8025' # Web UI

    frontend:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hairgen-frontend
        volumes:
            - type: bind
              source: .
              target: /app
            - frontend_node_modules:/app/node_modules
            - frontend_next:/app/.next
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
            mailpit:
                condition: service_started
        ports:
            - '127.0.0.1:3000:3000'
        env_file:
            - .env
            - .env.local
        environment:
            HOST: 0.0.0.0
            PORT: 3000
        restart: unless-stopped

    seed:
        build:
            context: .
        container_name: hairgen-seed
        working_dir: /app
        command: ['npm', 'run', 'seed']
        depends_on:
            postgres:
                condition: service_healthy
            minio:
                condition: service_healthy
        volumes:
            - type: bind
              source: .
              target: /app
            - frontend_node_modules:/app/node_modules
            - frontend_next:/app/.next
        env_file:
            - .env
            - .env.local
        environment:
            NEXT_RUNTIME: nodejs

    # A prison for claude coding agent
    prison:
        build:
            context: .
            dockerfile: Dockerfile.prison
        profiles: ['tools']
        working_dir: /app
        volumes:
            - .:/app
        tty: true
        stdin_open: true

volumes:
    postgres_data:
    minio_data:
    frontend_node_modules:
    frontend_next:
